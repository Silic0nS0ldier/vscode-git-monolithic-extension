name: "Copilot Setup Steps"
# Copilot cloud agent ignores `container:`, so this mirrors the devcontainer image's tooling on the
# runner host instead. Only steps, permissions, runs-on, services, snapshot and timeout-minutes apply.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions:
  contents: read
jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Prepare runc cache
        run: mkdir -p -m 700 ~/.cache/rules_oci_runtime
      # Started here, the cache proxy lives for the whole job and sits outside the agent's firewall.
      - uses: ./.github/actions/bazel
        with:
          fail-on-cache-error: "false"
          extra-bazelrc: |
            common --sandbox_writable_path=/home/runner/.cache/rules_oci_runtime
      # Same reason as in ci.yml: lets runc in //.devcontainer:image_test unshare namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: facebook/install-dotslash@v2
      - name: Put DotSlash stubs on PATH
        run: echo "$GITHUB_WORKSPACE/.devcontainer/dotslash" >> "$GITHUB_PATH"
      - name: Prefetch DotSlash tools
        run: |
          for stub in .devcontainer/dotslash/*; do dotslash -- fetch "$stub"; done
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Prefetch Bazel external repositories
        run: bazel fetch //...
