name: Optimise Bazel Cache

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan the optimisation without deleting or replacing cache entries"
        type: boolean
        default: true
      reap-unmanifested-packs:
        description: "Whether to reap unmanifested packs during optimisation"
        type: boolean
        default: true
      reap-older-than-hours:
        description: "Reap packs older than this many hours during optimisation"
        type: number
        default: 24

permissions:
  contents: read

# A second pass would plan against a view the first is already changing.
concurrency:
  group: optimise-bazel-cache
  cancel-in-progress: false

jobs:
  optimise:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Deleting the cache entries this pass replaces is the only thing that
      # needs write.
      actions: write
    steps:
      - uses: Silic0nS0ldier/bazel-github-actions-cache-v2/optimise@3deb60125f300e4f64b73775659d2b1b60e8f2e5
        with:
          dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
          github-token: ${{ github.token }}
          min-runs: 1
          pack-size-mb: 32
          max-new-mb: 4096
          reap-older-than-hours: ${{ github.event_name != 'workflow_dispatch' || inputs.reap-older-than-hours }}
          reap-unmanifested-packs: ${{ github.event_name != 'workflow_dispatch' || inputs.reap-unmanifested-packs }}