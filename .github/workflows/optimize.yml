name: Optimise Bazel Cache

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan the optimisation without deleting or replacing cache entries"
        type: boolean
        default: true

permissions:
  contents: read

# A second pass would plan against a view the first is already changing.
concurrency:
  group: optimise-bazel-cache
  cancel-in-progress: false

jobs:
  optimise:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Deleting the cache entries this pass replaces is the only thing that
      # needs write.
      actions: write
    steps:
      - uses: Silic0nS0ldier/bazel-github-actions-cache-v2/optimise@3dd59cffa9a5eb31c6828bda378aef387b9b4303
        with:
          github-token: ${{ github.token }}
          min-runs: 1
          dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}