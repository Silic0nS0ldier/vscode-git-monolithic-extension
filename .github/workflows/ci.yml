name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
permissions:
  contents: read
jobs:
  renovate_tasks:
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required to have correct ref for git-auto-commit-action
          ref: ${{ github.head_ref }}
      - uses: ./.github/actions/bazel
        with:
          # This is PR only, which does not upload, so there is no staging to run away.
          fail-on-cache-error: "false"
      - run: node ./.github/workflows/update_dotslash_stubs.mjs
      - run: node ./.github/workflows/update_bazel_nodejs.mjs ./MODULE.bazel
      - run: node ./.github/workflows/update_bazel_code_server.mjs
      - run: node ./.github/workflows/update_bazel_electron.mjs
      - run: node ./.github/workflows/update_bazel_git.mjs
      - run: node ./.github/workflows/update_bazel_rust.mjs
      - run: node ./.github/workflows/update_multitool_wasm_bindgen.mjs
      - run: node ./.github/workflows/update_devcontainer_apt_snapshot.mjs
      - run: bazel mod deps --lockfile_mode=update
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/mod.profile.gz
          archive: false
      # update_bazel_code_server.mjs can rewrite extension/package.json, which leaves
      # pnpm-lock.yaml stale for the `require-lockfile` install in build_and_test.
      - uses: pnpm/setup@v3.0.0
        with:
          install: false
      - run: pnpm install --lockfile-only
      - uses: stefanzweifel/git-auto-commit-action@v7
      - id: get_commit
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  build_and_test:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - name: Prepare runc cache
        run: mkdir -p -m 700 ~/.cache/rules_oci_runtime
      - uses: ./.github/actions/bazel
        with:
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          extra-bazelrc: |
            # Off by default; read by report_materialisations.sh.
            common --write_command_log
            common --sandbox_writable_path=/home/runner/.cache/rules_oci_runtime
      - uses: ./.github/actions/bazel-hidden-lockfile
        with:
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Refreshes only stale entries; the build and test commands keep `--lockfile_mode=error`.
      - run: bazel mod deps --lockfile_mode=update
      - run: git diff --exit-code MODULE.bazel.lock
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which denies runc
      # (//.devcontainer:image_test) the CAP_SYS_ADMIN it needs to unshare the mount namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Any later Bazel command deletes `command.log`, so resolve the path before building.
      - run: echo "OUTPUT_BASE=$(bazel info output_base)" >> "$GITHUB_ENV"
      - run: bazel test //...
        id: test
        continue-on-error: true
      - run: ./.github/workflows/report_materialisations.sh "bazel test //..." "$OUTPUT_BASE/command.log" "${{ runner.temp }}/test.profile.gz"
        if: always()
      - uses: actions/upload-artifact@v7
        if: steps.test.outcome == 'failure'
        with:
          name: test-logs
          path: .bazel/testlogs/**/test.log
          include-hidden-files: true
      - run: bazel build //extension/vsix:git_monolithic --stamp --config=release --remote_download_outputs=toplevel
        id: build_vsix
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: steps.build_vsix.outcome != 'failure'
        with:
          name: git-monolithic-vsix
          path: .bazel/bin/extension/vsix/git_monolithic.vsix
          archive: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/test.profile.gz
          archive: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/build.profile.gz
          archive: false
      - uses: pnpm/setup@v3.0.0
        with:
          cache: true
          install: false
      # Subset of dependencies for knip analysis
      - run: pnpm install --frozen-lockfile --prod --filter . --filter ./packages/wasm
      # pnpm >=12.7 skips `prepare` on `--prod` installs; knip needs the `dist` link it creates.
      - run: pnpm --filter ./packages/wasm run prepare
      - run: pnpm exec knip
        id: knip
        continue-on-error: true
      - run: exit 1
        if: steps.test.outcome == 'failure' || steps.build_vsix.outcome == 'failure' || steps.knip.outcome == 'failure'
  publish_devcontainer:
    # `renovate_tasks` is skipped on most runs, and a skip propagates down the whole `needs` chain
    # unless a status function is used, so `build_and_test` is checked explicitly.
    if: ${{ !cancelled() && needs.build_and_test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    needs: build_and_test
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bazel
      - uses: ./.github/actions/bazel-hidden-lockfile
        with:
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Refreshes only stale entries; the build and test commands keep `--lockfile_mode=error`.
      - run: bazel mod deps --lockfile_mode=update
      - run: git diff --exit-code MODULE.bazel.lock
      - name: Authenticate to ghcr.io
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
      - run: bazel run //.devcontainer:push_image
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/run.profile.gz
          archive: false
  jscpd:
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: facebook/install-dotslash@v2
      - run: ./.devcontainer/dotslash/jscpd .
  dprint:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - name: Install rustfmt
        run: rustup component add rustfmt
      - uses: facebook/install-dotslash@v2
      # The devcontainer image installs the stubs into /usr/bin; on CI they are only in the
      # workspace, so `buildifier` has to be put on PATH for dprint's exec plugin to find it.
      - name: Put DotSlash stubs on PATH
        run: echo "$GITHUB_WORKSPACE/.devcontainer/dotslash" >> "$GITHUB_PATH"
      - run: dprint check
