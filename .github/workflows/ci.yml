name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
permissions:
  contents: read
jobs:
  renovate_tasks:
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required to have correct ref for git-auto-commit-action
          ref: ${{ github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
            mod --profile=${{ runner.temp }}/mod.profile.gz
            mod --noslim_profile
          cache-save: false
          bazelisk-cache: true
          # Repo cache not worth it here, very little to fetch.
          repository-cache: false
      - run: node ./.github/workflows/update_dotslash_stubs.mjs
      - run: node ./.github/workflows/update_bazel_nodejs.mjs ./MODULE.bazel
      - run: node ./.github/workflows/update_bazel_code_server.mjs
      - run: node ./.github/workflows/update_bazel_electron.mjs
      - run: node ./.github/workflows/update_bazel_git.mjs
      - run: node ./.github/workflows/update_bazel_rust.mjs
      - run: node ./.github/workflows/update_multitool_wasm_bindgen.mjs
      - run: bazel mod deps --lockfile_mode=update
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/mod.profile.gz
          archive: false
      # update_bazel_code_server.mjs can rewrite extension/package.json, which leaves
      # pnpm-lock.yaml stale for the `require-lockfile` install in build_and_test.
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
      - run: pnpm install --lockfile-only
      - uses: stefanzweifel/git-auto-commit-action@v7
      - id: get_commit
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  build_and_test:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - id: remote_cache
        uses: cre4ture/bazel-github-actions-cache-v2@2bc512d6a198bbc46cd427435a9241b1ef4c6115 # v0.3.2
        with:
          pack-size-mb: 32
          # Also bounds initial manifest discovery, which scales with stored data. Caching repo
          # contents took manifests from 118 to 216 and 30s stopped being enough to enumerate them.
          backend-timeout-seconds: 120
          storage-mode: packs
          # TEMPORARY: pull requests are read-only under the default `auto`, which would leave the
          # repo-contents experiment below unable to populate anything. Revert to `auto` once it
          # has been measured.
          write: "true"
          # Packs are staged on the runner's disk until published. When publication stalls (e.g. the
          # 10 GB cache quota is full) that staging grows unbounded and exhausts the disk, killing
          # the runner rather than the build. Fail the request instead.
          fail-on-cache-error: "true"
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            startup --experimental_remote_repo_contents_cache
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
            common --lockfile_mode=error
            # Repo contents cache adds considerable pressure on GH Actions cache storage.
            # Disabled until we find a more efficient way to manage it.
            common --repo_contents_cache=
            common --remote_cache=${{ steps.remote_cache.outputs.url }}
            common --remote_upload_local_results=${{ steps.remote_cache.outputs.writable || 'false' }}
            build --profile=${{ runner.temp }}/build.profile.gz
            test --profile=${{ runner.temp }}/test.profile.gz
            build --experimental_profile_include_target_label
            build --noslim_profile
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          bazelisk-cache: true
          # Was saving a 3.1 GB archive per main push, and two of them had filled 6.2 GB of the
          # 10 GB quota. The remote cache covers actions and the repo contents cache now covers
          # repository fetches, so archiving the repository cache as well is redundant.
          repository-cache: false
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which denies runc
      # (//.devcontainer:image_test) the CAP_SYS_ADMIN it needs to unshare the mount namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bazel test //...
        id: test
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: steps.test.outcome == 'failure'
        with:
          name: test-logs
          path: .bazel/testlogs/**/test.log
          include-hidden-files: true
      - run: bazel build //extension/vsix:git_monolithic --stamp --config=release
        id: build_vsix
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: steps.build_vsix.outcome != 'failure'
        with:
          name: git-monolithic-vsix
          path: .bazel/bin/extension/vsix/git_monolithic.vsix
          archive: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/test.profile.gz
          archive: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/build.profile.gz
          archive: false
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec knip
        id: knip
        continue-on-error: true
      - run: exit 1
        if: steps.test.outcome == 'failure' || steps.build_vsix.outcome == 'failure' || steps.knip.outcome == 'failure'
  publish_devcontainer:
    # `renovate_tasks` is skipped on most runs, and a skip propagates down the whole `needs` chain
    # unless a status function is used, so `build_and_test` is checked explicitly.
    if: ${{ !cancelled() && needs.build_and_test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    needs: build_and_test
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - id: remote_cache
        uses: cre4ture/bazel-github-actions-cache-v2@2bc512d6a198bbc46cd427435a9241b1ef4c6115 # v0.3.2
        with:
          pack-size-mb: 32
          # Shares the manifest set with `build_and_test`, so it needs the same discovery budget.
          backend-timeout-seconds: 120
          storage-mode: packs
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
            common --lockfile_mode=error
            # Repo contents cache adds considerable pressure on GH Actions cache storage.
            # Disabled until we find a more efficient way to manage it.
            common --repo_contents_cache=
            common --remote_cache=${{ steps.remote_cache.outputs.url }}
            common --remote_upload_local_results=${{ steps.remote_cache.outputs.writable || 'false' }}
            run --profile=${{ runner.temp }}/run.profile.gz
            run --experimental_profile_include_target_label
            run --noslim_profile
          cache-save: false
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
      - name: Authenticate to ghcr.io
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
      - run: bazel run //.devcontainer:push_image
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ runner.temp }}/run.profile.gz
          archive: false
  jscpd:
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: facebook/install-dotslash@v2
      - run: ./.devcontainer/dotslash/jscpd .
  dprint:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - name: Install rustfmt
        run: rustup component add rustfmt
      - uses: facebook/install-dotslash@v2
      # The devcontainer image installs the stubs into /usr/bin; on CI they are only in the
      # workspace, so `buildifier` has to be put on PATH for dprint's exec plugin to find it.
      - name: Put DotSlash stubs on PATH
        run: echo "$GITHUB_WORKSPACE/.devcontainer/dotslash" >> "$GITHUB_PATH"
      - run: dprint check
