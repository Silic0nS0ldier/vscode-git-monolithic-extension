name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
jobs:
  renovate_tasks:
    if: github.actor == 'renovate[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required to have correct ref for git-auto-commit-action
          ref: ${{ github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
          cache-save: false
          bazelisk-cache: true
          # Repo cache not worth it here, very little to fetch.
          repository-cache: false
      - run: node ./.github/workflows/update_dotslash_stubs.mjs
      - run: node ./.github/workflows/update_bazel_nodejs.mjs ./MODULE.bazel
      - run: node ./.github/workflows/update_bazel_code_server.mjs
      - run: node ./.github/workflows/update_bazel_electron.mjs
      - run: node ./.github/workflows/update_bazel_git.mjs
      - run: node ./.github/workflows/update_bazel_rust.mjs
      - run: node ./.github/workflows/update_multitool_wasm_bindgen.mjs
      - run: bazel mod deps --lockfile_mode=update
      # update_bazel_code_server.mjs can rewrite extension/package.json, which leaves
      # pnpm-lock.yaml stale for the `require-lockfile` install in build_and_test.
      - uses: pnpm/setup@v2.1.0
        with:
          install: false
      - run: pnpm install --lockfile-only
      - uses: stefanzweifel/git-auto-commit-action@v7
      - id: get_commit
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
  build_and_test:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    permissions:
      contents: read
      # `storage-mode: packs` discovers manifest heads through the Actions cache REST API.
      actions: read
    # Publication is bounded by GitHub's cache-creation rate limit rather than by the build, and
    # Bazel waits on it. Drop back to 60 once the cache is seeded and PR uploads are turned off.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
            common --lockfile_mode=error
            # `--repo_contents_cache` defaults to `{--repository_cache}/contents`, and
            # setup-bazel archives all of `--repository_cache`. The contents cache is a second
            # copy of every repo, its GC never runs on an ephemeral runner (it is gated on five
            # minutes of server idle time), and it was ~70% of a 10GB cache entry.
            common --repo_contents_cache=
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-test"
          repository-cache: |
            - Cargo.lock
            - Cargo.toml
            - MODULE.bazel
            - MODULE.bazel.lock
            - multitool.lock.json
            - packages/wasm/Cargo.toml
            - pnpm-lock.yaml
      # Experimental, and pinned by commit SHA on the action author's own advice: it rides a
      # runner cache protocol GitHub does not document as stable. Failures degrade to cache
      # misses rather than failing the build.
      - id: remote_cache
        uses: cre4ture/bazel-github-actions-cache-v2@2bc512d6a198bbc46cd427435a9241b1ef4c6115 # v0.3.2
        with:
          # TEMPORARY: `true` also lets pull requests publish, which is how the cache gets
          # seeded before this lands on `main`. Revert to `auto` (default-branch pushes only)
          # once seeded — publication blocks Bazel on rate-limited uploads, so every PR paying
          # that cost is not a steady state. Forks stay read-only either way.
          write: "true"
          # Namespaced by storage format so a rollback does not read half-written state.
          key-prefix: git-monolithic-car-v1
          # `objects` mode is one cache creation per Bazel object. The local disk cache holds
          # ~66k objects at a median of 807 bytes, which at GitHub's 200/minute ceiling would
          # take hours. Packs turn that into one CARv2 archive plus one manifest per batch.
          storage-mode: packs
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which denies runc
      # (//.devcontainer:image_test) the CAP_SYS_ADMIN it needs to unshare the mount namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bazel test //... $REMOTE_CACHE_ARGS
        id: test
        continue-on-error: true
        env:
          REMOTE_CACHE_ARGS: ${{ steps.remote_cache.outputs.bazel-args }}
      - uses: actions/upload-artifact@v7
        if: steps.test.outcome == 'failure'
        with:
          name: test-logs
          path: .bazel/testlogs/**/test.log
          include-hidden-files: true
      - run: bazel build //extension/vsix:git_monolithic --stamp --config=release $REMOTE_CACHE_ARGS
        id: build_vsix
        continue-on-error: true
        env:
          REMOTE_CACHE_ARGS: ${{ steps.remote_cache.outputs.bazel-args }}
      - uses: actions/upload-artifact@v7
        if: steps.build_vsix.outcome != 'failure'
        with:
          name: git-monolithic-vsix
          path: .bazel/bin/extension/vsix/git_monolithic.vsix
          archive: false
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec knip
        id: knip
        continue-on-error: true
      - run: exit 1
        if: steps.test.outcome == 'failure' || steps.build_vsix.outcome == 'failure' || steps.knip.outcome == 'failure'
  publish_devcontainer:
    # `renovate_tasks` is skipped on most runs, and a skip propagates down the whole `needs` chain
    # unless a status function is used, so `build_and_test` is checked explicitly.
    if: ${{ !cancelled() && needs.build_and_test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    needs: build_and_test
    permissions:
      contents: read
      packages: write
      # As in build_and_test: manifest-head discovery for `storage-mode: packs`.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --color=yes
            common --curses=no
            common --show_progress_rate_limit=5
            common --lockfile_mode=error
            common --repo_contents_cache=
          cache-save: false
          bazelisk-cache: true
          # Shares build_and_test's key rather than keeping a second multi-GB entry: this job
          # rebuilds a subgraph that job already built, and the two competed for the same
          # repository-wide 10GB quota.
          disk-cache: "${{ github.workflow }}-test"
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
      - id: remote_cache
        uses: cre4ture/bazel-github-actions-cache-v2@2bc512d6a198bbc46cd427435a9241b1ef4c6115 # v0.3.2
        with:
          # This job only runs on `main` pushes, so `auto` means it always publishes.
          write: auto
          key-prefix: git-monolithic-car-v1
          storage-mode: packs
      - name: Authenticate to ghcr.io
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
      - run: bazel run //.devcontainer:push_image $REMOTE_CACHE_ARGS
        env:
          REMOTE_CACHE_ARGS: ${{ steps.remote_cache.outputs.bazel-args }}
  jscpd:
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - uses: facebook/install-dotslash@v2
      - run: ./.devcontainer/dotslash/jscpd .
  dprint:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    needs: renovate_tasks
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash || github.head_ref }}
      - name: Install rustfmt
        run: rustup component add rustfmt
      - uses: facebook/install-dotslash@v2
      # The devcontainer image installs the stubs into /usr/bin; on CI they are only in the
      # workspace, so `buildifier` has to be put on PATH for dprint's exec plugin to find it.
      - name: Put DotSlash stubs on PATH
        run: echo "$GITHUB_WORKSPACE/.devcontainer/dotslash" >> "$GITHUB_PATH"
      - run: dprint check
