packages:
  - packages/*
  - build_defs/*
  - extension
  - integration_tests

allowBuilds: 
  '@vscode/vsce-sign': false
  core-js-pure: false
  dtrace-provider: false
  keytar: false
  re2: false

catalog:
  '@types/node': ^25.9.5
  ava: ^8.0.1
  cleye: ^2.6.0
  get-stream: ^9.0.1

catalogs:
  vscode:
    '@types/node': ^24.13.3

packageExtensions:
  "@secretlint/resolver":
    dependencies:
      "@secretlint/secretlint-rule-basicauth": "^10.2.2"
      "@secretlint/secretlint-rule-no-dotenv": "^10.2.2"
      "@secretlint/secretlint-rule-npm": "^10.2.2"
      "@secretlint/secretlint-rule-preset-recommend": "^10.2.2"
      "@secretlint/secretlint-rule-privatekey": "^10.2.2"
  "@textlint/resolver":
    dependencies:
      "@secretlint/secretlint-formatter-sarif": "^10.2.2"
  # chalk added as workaround for https://github.com/aspect-build/rules_lint/issues/752
  "eslint":
    dependencies:
      "chalk": "^4.0.0"

patchedDependencies:
  "watcher@2.3.1": "patches/watcher@2.3.1.patch"

minimumReleaseAgeExclude:
  # Temporary exception. Remove after 2026-07-28.
  - eslint@10.8.0
  # As above, from `pnpm audit --fix update`
  - tmp@0.2.6
  - form-data@4.0.6
  - tar@7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - markdown-it@14.1.2
  - undici@7.28.0
  - linkify-it@5.0.1 || 5.0.2
  - js-yaml@3.15.0 || 4.1.2 || 4.3.0
  - fast-uri@3.1.3 || 3.1.4
