packages:
  - packages/*
  - build_defs/*
  - .github/actions/*
  - extension
  - integration_tests

# Keep artifact resolution (including transitive dependencies) aligned with Renovate's three-day delay.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
saveExact: true

allowBuilds: 
  '@vscode/vsce-sign': false
  core-js-pure: false
  dtrace-provider: false
  keytar: false
  protobufjs: false
  re2: false

catalog:
  '@types/node': 26.6.6
  ava: 8.4.0
  cleye: 2.7.0
  get-stream: 9.0.1

catalogs:
  vscode:
    '@types/node': 24.13.3

packageExtensions:
  # Imported by the generated twirp client but not declared.
  "@actions/cache":
    dependencies:
      "@protobuf-ts/runtime": "^2.11.1"
  # chalk added as workaround for https://github.com/aspect-build/rules_lint/issues/752
  "eslint":
    dependencies:
      "chalk": "^4.0.0"

overrides:
  # Leaner 3.x (drops the per-name maps watcher never reads); types fixed up by the watcher patch.
  "watcher>tiny-readdir": "3.1.1"
  # Promise.withResolvers ponyfill, inlined by the tiny-readdir patch.
  "tiny-readdir>promise-make-counter": "-"
  # @vercel/nft, cacache, and rimraf still resolve vulnerable glob 13/10 releases.
  # Keep until those consumers request the fixed glob 14 line.
  "glob@>=9.0.0 <=14.0.1": "14.0.4"
  # ESLint, TypeScript ESLint, @actions/glob, and vsce still request vulnerable minimatch 10.
  # Stop before minimatch 3 to preserve legacy glob 6 compatibility; widen when consumers update.
  "minimatch@>=9.0.0 <11.0.1": "11.0.7"

patchedDependencies:
  "tiny-readdir@3.1.1": "patches/tiny-readdir@3.1.1.patch"
  "watcher@2.3.1": "patches/watcher@2.3.1.patch"

permissions:
  cleye:
    skills: false
