packages:
  - packages/*
  - build_defs/*
  - .github/actions/*
  - extension
  - integration_tests

allowBuilds: 
  '@vscode/vsce-sign': false
  core-js-pure: false
  dtrace-provider: false
  keytar: false
  protobufjs: false
  re2: false

catalog:
  '@types/node': ^25.9.9
  ava: ^8.0.1
  cleye: ^2.7.0
  get-stream: ^9.0.1

catalogs:
  vscode:
    '@types/node': ^24.13.3

packageExtensions:
  # Imported by the generated twirp client but not declared.
  "@actions/cache":
    dependencies:
      "@protobuf-ts/runtime": "^2.11.1"
  # chalk added as workaround for https://github.com/aspect-build/rules_lint/issues/752
  "eslint":
    dependencies:
      "chalk": "^4.0.0"

patchedDependencies:
  "watcher@2.3.1": "patches/watcher@2.3.1.patch"

minimumReleaseAgeExclude:
  # Temporary exception. Remove after 2026-07-28.
  - eslint@10.8.0
  # As above, from `pnpm audit --fix update`
  - tmp@0.2.6
  - form-data@4.0.6
  - tar@7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - markdown-it@14.1.2
  - undici@7.28.0
  - linkify-it@5.0.1 || 5.0.2
  - js-yaml@3.15.0 || 4.1.2 || 4.3.0
  - fast-uri@3.1.3 || 3.1.4
  - "@rollup/rollup-android-arm-eabi@4.64.2"
  - "@rollup/rollup-android-arm64@4.64.2"
  - "@rollup/rollup-darwin-arm64@4.64.2"
  - "@rollup/rollup-darwin-x64@4.64.2"
  - "@rollup/rollup-freebsd-arm64@4.64.2"
  - "@rollup/rollup-freebsd-x64@4.64.2"
  - "@rollup/rollup-linux-arm-gnueabihf@4.64.2"
  - "@rollup/rollup-linux-arm-musleabihf@4.64.2"
  - "@rollup/rollup-linux-arm64-gnu@4.64.2"
  - "@rollup/rollup-linux-arm64-musl@4.64.2"
  - "@rollup/rollup-linux-loong64-gnu@4.64.2"
  - "@rollup/rollup-linux-loong64-musl@4.64.2"
  - "@rollup/rollup-linux-ppc64-gnu@4.64.2"
  - "@rollup/rollup-linux-ppc64-musl@4.64.2"
  - "@rollup/rollup-linux-riscv64-gnu@4.64.2"
  - "@rollup/rollup-linux-riscv64-musl@4.64.2"
  - "@rollup/rollup-linux-s390x-gnu@4.64.2"
  - "@rollup/rollup-linux-x64-gnu@4.64.2"
  - "@rollup/rollup-linux-x64-musl@4.64.2"
  - "@rollup/rollup-openbsd-x64@4.64.2"
  - "@rollup/rollup-openharmony-arm64@4.64.2"
  - "@rollup/rollup-win32-arm64-msvc@4.64.2"
  - "@rollup/rollup-win32-ia32-msvc@4.64.2"
  - "@rollup/rollup-win32-x64-gnu@4.64.2"
  - "@rollup/rollup-win32-x64-msvc@4.64.2"
  - rollup@4.64.2
